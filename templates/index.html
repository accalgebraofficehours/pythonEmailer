<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px;

            background: #1e1e1e;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            background: #333;
            color: white;
        }

        button {
            padding: 12px 20px;

            border: none;
            border-radius: 6px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Send Something</h1>

        <div class="input-row">
            <input
                id="input"
                type="text"
                placeholder="Enter something..."
            >

            <button onclick="sendInput()">
                Send
            </button>
        </div>
    </div>

    <script>
        async function sendInput() {
            const inputElement = document.getElementById("input");
            const value = inputElement.value;

            if (!value.trim()) {
                return;
            }

            try {
                await fetch("/send", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        input: value
                    })
                });

                // Clear the input after sending
                inputElement.value = "";

            } catch (error) {
                console.error("Failed to send:", error);
            }
        }
    </script>

</body>
</html>
